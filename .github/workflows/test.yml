name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Lint
        run: |
          flake8 startup_swarm tests
          black --check startup_swarm tests
      - name: Tests (offline)
        run: python -m pytest -q

  package:
    # Builds the wheel and uses it from outside the repo, the way other projects will.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in a clean venv and dry-run
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          mkdir /tmp/try && cd /tmp/try
          /tmp/venv/bin/startup-swarm info
          /tmp/venv/bin/startup-swarm init
          /tmp/venv/bin/startup-swarm run --mock --idea "CI smoke test"
          /tmp/venv/bin/startup-swarm status --mock

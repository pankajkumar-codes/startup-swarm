name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          flake8 orchestrator agents agentcore_app scripts tests
          black --check orchestrator agents agentcore_app scripts tests infrastructure
      - name: Unit and integration tests (offline, mock mode)
        env:
          AWS_MOCK_MODE: "1"
        run: python -m pytest -q
      - name: Offline end-to-end dry run
        run: |
          startup-swarm run --mock --workspace /tmp/swarm-ci --idea "CI smoke test"
          startup-swarm status --mock --workspace /tmp/swarm-ci

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Synthesize both stages (no AWS credentials needed)
        working-directory: infrastructure
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk
          cdk synth -c stage=beta > /dev/null
          cdk synth -c stage=prod > /dev/null
          cdk synth -c stage=beta -c github_repo=example/repo > /dev/null

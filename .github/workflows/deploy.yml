name: Deploy

# develop -> beta, main -> prod. Both run the full CI first.
# Uses GitHub OIDC (no AWS keys stored in GitHub). One-time setup per stage:
#   1. cdk deploy GitHubDeployStack-<Stage> -c stage=<stage> -c github_repo=<owner>/<repo>
#   2. In GitHub > Settings > Environments, create "beta" and "prod" and set the
#      environment variables AWS_DEPLOY_ROLE_ARN (stack output DeployRoleArn) and AWS_REGION.
#   3. Add "Required reviewers" to the prod environment so prod deploys need a human click.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'beta' }}
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'beta' }}
    steps:
      - name: Skip if AWS is not connected yet
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        run: echo "::notice::AWS_DEPLOY_ROLE_ARN is not set for the ${{ env.STAGE }} environment, so deploy is skipped. See README > CI/CD."
      - uses: actions/checkout@v4
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
      - uses: actions/setup-python@v5
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          node-version: "20"
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy infrastructure
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        working-directory: infrastructure
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk
          SUFFIX=$([ "$STAGE" = "prod" ] && echo Prod || echo Beta)
          cdk deploy "StartupOrchestratorStack-$SUFFIX" -c stage=$STAGE \
            --require-approval never --outputs-file cdk-outputs-$STAGE.json
      - uses: actions/upload-artifact@v4
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          name: cdk-outputs-${{ env.STAGE }}
          path: infrastructure/cdk-outputs-${{ env.STAGE }}.json
